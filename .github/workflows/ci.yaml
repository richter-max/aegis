name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly dependency audit, so new advisories surface without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  quality:
    name: Quality (Ruff + Mypy + Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with Mypy
        run: mypy aegis

      - name: Test with Pytest
        run: pytest -v --tb=short

  benchmark:
    name: Benchmark reproduces published results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Run the full sweep
        run: aegis bench --config configs/experiments/full_sweep.json --report-id ci

      - name: Compare against the committed baseline
        run: |
          python - <<'EOF'
          import json
          import sys

          def rates(path):
              data = json.load(open(path, encoding="utf-8"))
              return {
                  (r["policy"], r["guard"]): (
                      r["attack_success_rate"],
                      r["false_positive_rate"],
                  )
                  for r in data["aggregate"]
              }

          baseline = rates("reports/bench/baseline/bench_summary.json")
          current = rates("reports/bench/ci/bench_summary.json")

          if baseline != current:
              print("Benchmark results drifted from the committed baseline.\n")
              for key in sorted(set(baseline) | set(current)):
                  want, got = baseline.get(key), current.get(key)
                  flag = "  " if want == got else "->"
                  print(f"{flag} {key}: baseline={want} current={got}")
              print(
                  "\nIf this change is intended, regenerate the baseline with:\n"
                  "  aegis bench --config configs/experiments/full_sweep.json "
                  "--report-id baseline\n"
                  "and update the results table in README.md."
              )
              sys.exit(1)

          print(f"Benchmark reproduces the baseline across {len(baseline)} configurations.")
          EOF

  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install bandit

      - name: Run Bandit
        run: bandit -c pyproject.toml -r aegis

  fuzz:
    name: Fuzz Tests (Hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Run Fuzz Tests
        run: pytest fuzz/fuzz_guards.py -v --tb=short

  supply-chain:
    name: Supply Chain Audit (pip-audit)
    runs-on: ubuntu-latest
    # Advisory only. pip-audit reports vulnerabilities in transitive dependencies
    # that this project does not select and often cannot pin - a finding in the
    # runner's own setuptools should not turn the build red. Findings are visible
    # in the job log and in the run summary.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install pip-audit

      - name: Audit dependencies
        run: |
          # pip-audit writes no report file when it finds nothing, so guard the read.
          pip-audit --desc --format markdown --output audit.md || true
          {
            echo "## Dependency audit"
            echo
            if [ -s audit.md ]; then
              cat audit.md
            else
              echo "No known vulnerabilities found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          pip-audit
